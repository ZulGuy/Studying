<div class="container mt-5">
  <h4>🔑 Забули пароль?</h4>

  <form (submit)="submit(); $event.preventDefault()" *ngIf="!success">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input [(ngModel)]="email" name="email" class="form-control" type="email" required />
    </div>
    <button class="btn btn-primary" type="submit">Надіслати посилання</button>
    <div class="text-danger mt-2" *ngIf="error">{{ error }}</div>
  </form>

  <div *ngIf="success" class="alert alert-success">
    📩 Перевірте свою пошту — ми надіслали інструкції для скидання пароля.
  </div>
</div>
