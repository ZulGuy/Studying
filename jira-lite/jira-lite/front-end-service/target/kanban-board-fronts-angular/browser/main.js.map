<div class="container mt-5">
  <h4>🔐 Встановити новий пароль</h4>

  <form (submit)="submit(); $event.preventDefault()" *ngIf="!success">
    <div class="mb-3">
      <label class="form-label">Новий пароль</label>
      <input [(ngModel)]="newPassword" name="newPassword" class="form-control" type="password" required minlength="6" />
    </div>
    <button class="btn btn-success" type="submit">Зберегти</button>
    <div class="text-danger mt-2" *ngIf="error">{{ error }}</div>
  </form>

  <div *ngIf="success" class="alert alert-success">
    ✅ Пароль успішно змінено. Перенаправляємо на сторінку входу...
  </div>
</div>
