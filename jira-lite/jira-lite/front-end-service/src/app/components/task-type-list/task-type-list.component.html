<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Issue Types</div>
      <div class="page-subtitle">{{ taskTypes.length }} type{{ taskTypes.length !== 1 ? 's' : '' }} in your workspace</div>
    </div>
  </div>

  <div class="add-form">
    <input class="form-control" [(ngModel)]="newTypeName" placeholder="New issue type name..." (keyup.enter)="addType()" />
    <button class="btn btn-primary" (click)="addType()" [disabled]="!newTypeName.trim()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add type
    </button>
  </div>

  <div class="table-wrapper" *ngIf="taskTypes.length > 0">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let type of taskTypes" (click)="goToType(type.name)">
          <td class="fw-bold">{{ type.name }}</td>
          <td>
            <div class="row-actions">
              <button class="btn btn-outline-primary btn-sm" (click)="goToType(type.name); $event.stopPropagation()">View issues</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="taskTypes.length === 0" class="empty-state">
    <p>No issue types yet. Add your first one above.</p>
  </div>
</div>
