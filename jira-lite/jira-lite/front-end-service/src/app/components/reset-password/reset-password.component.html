<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">New password</h1>
      <p class="auth-subtitle">Choose a strong password for your account</p>
    </div>

    <form (submit)="submit(); $event.preventDefault()" *ngIf="!success" class="auth-form">
      <div class="field">
        <label class="form-label">New password</label>
        <input [(ngModel)]="newPassword" name="newPassword" class="form-control" type="password" required minlength="6" placeholder="Min. 6 characters" />
      </div>
      <button class="btn btn-success btn-full" type="submit">Save Password</button>
      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    </form>

    <div *ngIf="success" class="alert alert-success">
      Password updated. Redirecting to login...
    </div>
  </div>
</div>
