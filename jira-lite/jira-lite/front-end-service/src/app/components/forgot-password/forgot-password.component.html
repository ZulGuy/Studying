<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Reset password</h1>
      <p class="auth-subtitle">Enter your email and we'll send a reset link</p>
    </div>

    <form (submit)="submit(); $event.preventDefault()" *ngIf="!success" class="auth-form">
      <div class="field">
        <label class="form-label">Email address</label>
        <input [(ngModel)]="email" name="email" class="form-control" type="email" required placeholder="you@example.com" />
      </div>
      <button class="btn btn-primary btn-full" type="submit">Send Reset Link</button>
      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    </form>

    <div *ngIf="success" class="alert alert-success">
      Check your inbox — we sent password reset instructions.
    </div>

    <div class="auth-footer">
      <a routerLink="/login">Back to sign in</a>
    </div>
  </div>
</div>
