<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Invite user</div>
      <div class="page-subtitle">Send an invitation link to a new workspace member</div>
    </div>
  </div>

  <div class="invite-card">
    <div class="field">
      <label class="form-label">Email address</label>
      <div class="invite-row">
        <input [(ngModel)]="email" type="email" class="form-control" placeholder="colleague@company.com" />
        <button class="btn btn-primary" (click)="sendInvitation()">Send invitation</button>
      </div>
    </div>
    <div *ngIf="message" class="alert alert-success mt-12">{{ message }}</div>
  </div>
</div>
