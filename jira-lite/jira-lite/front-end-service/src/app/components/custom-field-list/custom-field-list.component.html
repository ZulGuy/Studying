<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Custom Fields</div>
      <div class="page-subtitle">{{ fields.length }} field{{ fields.length !== 1 ? 's' : '' }} in your workspace</div>
    </div>
  </div>

  <div class="add-card">
    <div class="add-form">
      <input class="form-control" [(ngModel)]="newField.name" placeholder="Field name..." (keyup.enter)="addField()" />
      <select class="form-select type-select" [(ngModel)]="newField.fieldType">
        <option *ngFor="let t of fieldTypes" [value]="t">{{ t }}</option>
      </select>
      <button class="btn btn-primary" (click)="addField()" [disabled]="!newField.name.trim()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add field
      </button>
    </div>
  </div>

  <div class="table-wrapper" *ngIf="fields.length > 0">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let field of fields">
          <td class="fw-bold">{{ field.name }}</td>
          <td>
            <span class="type-badge">{{ field.type }}</span>
          </td>
          <td>
            <div class="row-actions">
              <button class="btn btn-outline-primary btn-sm" (click)="editField(field.id)">Edit</button>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteField(field.id)">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="fields.length === 0" class="empty-state">
    <p>No custom fields yet. Add your first one above.</p>
  </div>
</div>
