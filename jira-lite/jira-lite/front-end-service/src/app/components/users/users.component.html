<div *ngIf="canManageUsers()" class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Users</div>
      <div class="page-subtitle">Manage workspace members</div>
    </div>
    <button class="btn btn-primary btn-sm" (click)="openAddUserModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add user
    </button>
  </div>

  <div class="toolbar">
    <input type="text" class="form-control search" [(ngModel)]="searchTerm" (input)="filterUsers()" placeholder="Search by name..." />
    <select class="form-select per-page" [(ngModel)]="usersPerPage" (change)="filterUsers()">
      <option [value]="5">5 per page</option>
      <option [value]="10">10 per page</option>
      <option [value]="20">20 per page</option>
    </select>
  </div>

  <div class="table-wrapper">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of paginatedUsers">
          <td class="fw-bold">{{ user.name }}</td>
          <td class="text-secondary">{{ user.email }}</td>
          <td>{{ user.role === 'ROLE_USER' ? 'User' : 'Administrator' }}</td>
          <td>
            <span class="badge" [ngClass]="user.active ? 'bg-success' : 'bg-danger'">
              {{ user.active ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td>
            <div class="row-actions">
              <button class="btn btn-outline-primary btn-sm" (click)="goToUser(user.id)">View</button>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteUser(user.id)">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button class="btn btn-secondary btn-sm" (click)="prevPage()" [disabled]="currentPage === 1">Previous</button>
    <span class="page-info">Page {{ currentPage }} of {{ totalPages }}</span>
    <button class="btn btn-secondary btn-sm" (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
  </div>
</div>
