<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Create project</h2>
      <button class="modal-close" (click)="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label class="form-label">Project name</label>
        <input class="form-control" [(ngModel)]="name" required autofocus placeholder="e.g. Marketing Website" />
      </div>
      <div class="field">
        <label class="form-label">Description <span class="optional">optional</span></label>
        <textarea class="form-control" rows="3" [(ngModel)]="description" placeholder="Brief project description"></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="submit()" [disabled]="!name.trim()">Create project</button>
    </div>
  </div>
</div>
